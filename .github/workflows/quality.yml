name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./data/ci/app.db
      JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
      LLM_PRIMARY_PROVIDER: openai
      LLM_FALLBACK_PROVIDER: none
      OPENAI_API_KEY: ""
      RAG_PERF_LOG_ENABLED: "false"
      RAG_LLM_HTTP_LOG_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python modules
        run: python -m compileall -q app src

      - name: Run offline test suite
        run: python -m pytest -q

  react:
    name: React lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/react-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/react-console/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=moderate

      - name: Reject high or critical development vulnerabilities
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
