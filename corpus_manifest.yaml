    params:
      # A API de consulta do PCA exige os nomes abaixo e datas yyyyMMdd.
      # O CNPJ limita a primeira carga a um recorte pequeno e reproduzível.
      dataInicio: "20250401"
      dataFim: "20250430"
      cnpj: "42498733000148"
    pagination:
      page_param: pagina
      page_size_param: tamanhoPagina
      page_size: 10
      max_pages: 2
    request:
      timeout_seconds: 30
      rate_limit_seconds: 0.2
      max_retries: 3
      retry_backoff_seconds: 0.5
    item_path: data
    key_fields:
      - idPcaPncp

  # PCA completo de 2023 para os órgãos encontrados nas contratações do RJ.
  # A API de PCA não aceita UF; por isso os CNPJs são resolvidos da RAW
  # estruturada e cada plano é buscado integralmente com todos os seus itens.
